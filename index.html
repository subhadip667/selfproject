<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <link href="Content/bootstrap.min.css" rel="stylesheet" />
    <link href="Content/login.css" rel="stylesheet" />
   
    <script src="Scripts/jquery-3.7.1.min.js"></script>
    <script src="Scripts/bootstrap.min.js"></script>
</head>
<body>
    <div class="hero-text">
        <h1> সেবা সেতু  </h1>
        <h2>আপনার এলাকার দক্ষ মানুষের পরিষেবা এখন এক জায়গায়</h2>
        <!--<p>
            আপনার েয়াজনীয় সব পিরেষবা খু ঁেজ িনন সহেজ ত এবং িনভরেযাগ ভােব
        </p>-->
       
    </div>
    <div class="login-wrapper">

        <div class="login-box">

            <div class="avatar">
                <span class="glyphicon glyphicon-user"></span>
            </div>


            <div class="login-content">

                <h3>Member Login</h3>

                <div class="form-group">

                    <input id="txtusername" type="text" Class="form-control"
                           placeholder="Username" class="glyphicon glyphicon-user" />
                </div>

                <div class="form-group">

                    <input id="txtpassword" type="text" Class="form-control"
                           TextMode="Password"
                           placeholder="Password" class="glyphicon glyphicon-lock" />
                </div>

                <!-- Buttons Left and Right -->
                <div class="login-buttons">

                    <button type="button"
                            class="btn btn-login"
                            onclick="window.location.href='sevasetu.html'">
                        Guest
                    </button>

                    <button type="button"
                            class="btn btn-login"
                            onclick="window.location.href='Registration.html'">
                        Registration/Sign In
                    </button>

                </div>

                <!--<asp:Label ID="lblmsg"
                           runat="server">
                </asp:Label>-->

            </div>

            <div class="login-footer">
                <a href="#">Forgot Password?</a>
            </div>

        </div>

    </div>
</body>
</html>
