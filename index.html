<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />
    <link href="Content/bootstrap.min.css" rel="stylesheet" />
    <link href="Content/login.css" rel="stylesheet" />

    <script src="Scripts/jquery-3.7.1.min.js"></script>
    <script src="Scripts/bootstrap.min.js"></script>
</head>
<body>
    <div class="login-wrapper">

        <div class="login-box">

            <div class="avatar">
                <span class="glyphicon glyphicon-user"></span>
            </div>

            <div class="login-content">

                <h3>Member Login</h3>

                <div class="form-group">
                    
                    <input id="txtusername" type="text"  Class="form-control"
                                 placeholder="Username" />
                </div>

                <div class="form-group">
                   
                    <input id="txtpassword" type="text"  Class="form-control"
                                 TextMode="Password"
                                 placeholder="Password"/>
                </div>

                <div class="form-group">
                    <input id="Submit1" type="submit" value="Registrattion/Sign In" Class="btn btn-login btn-block" onclick="window.location.href='Registration.html'" />
                    <input id="Submit1" type="submit" value="Guest" Class="btn btn-login btn-block" Text="Guest" />
                </div>

                <!--<asp:Label ID="lblmsg"
                           runat="server">
                </asp:Label>-->

            </div>

            <div class="login-footer">
                <a href="#">Forgot Password?</a>
            </div>

        </div>

    </div>
</body>
</html>
